<title>منصة الصحة المدرسية - القطاع الشمالي</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:type" content="website"><meta property="og:title" content="منصة الصحة المدرسية - القطاع الشمالي"><meta property="og:description" content="مؤشرات إنجاز الصحة المدرسية لمراكز القطاع الشمالي - تجمع جازان الصحي"><meta property="og:image" content="https://school-health-north.pages.dev/og-platform.png"><meta property="og:locale" content="ar_SA"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="مؤشرات إنجاز الصحة المدرسية لمراكز القطاع الشمالي - تجمع جازان الصحي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky brand bar, five-step wizard (center, schools, targets, progress, dashboard), sector roll-up view */
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--ink:#17212B;--muted:#5E6B78;--line:#DCE3EA;--soft:#EEF3F7;
  --band:#0F2C46;--band-ink:#FFFFFF;--navy:#0F2C46;--teal:#14808A;--teal-ink:#FFFFFF;--gold:#C9A227;--gold-ink:#F3D77A;--accent:#1D8FC4;
  --ok:#237A49;--ok-bg:#DFF3E7;--bad:#B5352A;--bad-bg:#FADBD8;--warn:#9A6200;--warn-bg:#FFF1D6;--zebra:#F8FAFC;
  --shadow:0 1px 2px rgba(15,44,70,.06),0 6px 18px rgba(15,44,70,.07);--wave-o:.6;
  --f-display:'Amiri','Noto Naskh Arabic','FreeSerif',serif;--f-body:'Noto Naskh Arabic','Amiri','FreeSerif',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C;--surface:#16212B;--ink:#E6EDF3;--muted:#9AA8B5;--line:#27384A;--soft:#1B2A37;
  --band:#1B3A57;--navy:#9CC5E6;--teal:#1F6F78;--gold:#E0BE4A;--gold-ink:#F0CF6A;--accent:#4FB2E3;
  --ok:#6FD39A;--ok-bg:#17382A;--bad:#F08A7E;--bad-bg:#40211F;--warn:#F2B552;--warn-bg:#3D2E10;--zebra:#1A2733;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--wave-o:.28;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C;--surface:#16212B;--ink:#E6EDF3;--muted:#9AA8B5;--line:#27384A;--soft:#1B2A37;
  --band:#1B3A57;--navy:#9CC5E6;--teal:#1F6F78;--gold:#E0BE4A;--gold-ink:#F0CF6A;--accent:#4FB2E3;
  --ok:#6FD39A;--ok-bg:#17382A;--bad:#F08A7E;--bad-bg:#40211F;--warn:#F2B552;--warn-bg:#3D2E10;--zebra:#1A2733;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--wave-o:.28;color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1040px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
/* brand bar */
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:12px 8px}
.brand-t{font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:clamp(17px,3.6vw,22px);line-height:1.35}
.brand-t small{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.brand img{height:56px;width:auto;flex:none}
.saved{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:10px 18px;min-height:46px;font-weight:700;text-decoration:none;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1500}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
/* home */
.hero{background:var(--band);color:var(--band-ink);border-radius:20px;padding:clamp(22px,5vw,44px);display:grid;gap:14px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-display);font-size:clamp(28px,6vw,46px);line-height:1.25;margin:0;text-wrap:balance}
.hero p{margin:0;max-width:56ch;opacity:.92;font-size:clamp(15px,2.4vw,18px)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .btn.gold{font-size:16px;padding-inline:18px}
.hero .acts .btn{white-space:nowrap;padding-inline:14px;font-size:15px;flex:0 1 auto}
@media(max-width:900px){.hero .acts{flex-wrap:wrap}}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.hero::after{content:"";pointer-events:none;position:absolute;inset-inline-start:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(255,255,255,.06)}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-block:18px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start}
.how b{font-family:var(--f-display);font-size:18px;color:var(--navy)}
.how span{font-size:14px;color:var(--muted)}
.how svg{width:30px;height:30px;color:var(--teal)}

.about{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3.5vw,26px);box-shadow:var(--shadow);margin-block:14px}
.about h2{font-family:var(--f-display);font-size:clamp(22px,4vw,28px);color:var(--navy);margin:0 0 6px;padding-bottom:8px;border-bottom:3px solid var(--gold);display:inline-block}
.about>p{margin:8px 0 14px;color:var(--ink);max-width:70ch}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.goals>div{background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start}
.goals b{font-family:var(--f-display);font-size:18px;color:var(--navy)}
.goals span{font-size:14px;color:var(--muted)}
.goals svg{width:30px;height:30px;color:var(--teal)}
.how div{background:var(--soft);border:0}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-weight:700;color:var(--navy)}
.flow span{background:var(--soft);border-radius:999px;padding:6px 14px;font-size:14px}
.flow i{font-style:normal;color:var(--teal)}
.three.two{grid-template-columns:repeat(2,1fr)}.three.one{grid-template-columns:1fr}
td.cp{line-height:1.3}td.cp b{display:block;font-size:15px}td.cp small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.pill.blue{background:#E1EEFB;color:#1D5FA8}
.gd-list{display:grid;gap:10px}.gd-row{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px}.gd-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.gd-h b{font-family:var(--f-display);font-size:17px;color:var(--navy)}.gd-d{font-size:14px;color:var(--muted)}.gd-v{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:6px 12px}.gd-v .val{font-weight:700;color:var(--navy);word-break:break-word}
.formlist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.frm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow)}.frm svg{color:var(--teal)}.frm b{font-family:var(--f-display);font-size:19px;color:var(--navy)}.frm span{font-size:14px;color:var(--muted)}.acts2{display:flex;gap:8px;margin-top:4px}.acts2 a{text-decoration:none}
@media(max-width:720px){.formlist{grid-template-columns:1fr}}
@media(max-width:720px){.goals,.how,.three.two{grid-template-columns:1fr}}
.resume{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-block:14px 0;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-block:6px 18px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;text-align:start;box-shadow:var(--shadow);cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt b{font-family:var(--f-display);font-size:20px;color:var(--navy)}
.opt span{font-size:14px;color:var(--muted)}
.opt svg{width:34px;height:34px;color:var(--teal)}
/* stepper */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:0;background:var(--soft);border-radius:12px;padding:8px 6px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:13px}
.step[aria-current="step"]{background:var(--surface);color:var(--navy);border-bottom-color:var(--gold);box-shadow:var(--shadow)}
.step[aria-current="step"] i{background:var(--band);color:var(--band-ink)}
.step.done i{background:var(--ok);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3.5vw,28px);box-shadow:var(--shadow);margin-block:10px}
.panel h2{font-family:var(--f-display);font-size:clamp(22px,4vw,28px);color:var(--navy);margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-weight:700;font-size:14.5px;color:var(--navy)}
.field small{color:var(--muted);font-size:12.5px}
.in{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--bg);color:var(--ink)}
.in:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.in.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .hint{color:var(--muted);font-size:13px;align-self:center}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:42px;padding:4px 8px;font-weight:700;color:var(--muted);line-height:1.25;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg.st button{font-size:12.5px;min-height:48px;border:1.5px solid transparent}
.seg.st button[aria-pressed="true"][data-v="0"]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.seg.st button[aria-pressed="true"][data-v="1"]{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.seg.st button[aria-pressed="true"][data-v="2"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
/* schools */
.sch{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.sch-h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sch-n{font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:18px}
.stack{display:grid;gap:12px}
.step3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scr{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:10px}
.cnt{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.cnt button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.cnt input{text-align:center;direction:ltr}
.tog{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--teal)}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:700;font-size:13px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
/* targets */
.tgt{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:520px}
.tgt th{background:transparent;color:var(--muted);font-size:13px;padding:2px 6px}
.tgt td{padding:6px;background:var(--bg);border:0;text-align:center}
.tgt td:first-child{border-radius:0 12px 12px 0;text-align:right}
.tgt td:last-child{border-radius:12px 0 0 12px}
.tgt .nm{display:flex;gap:8px;align-items:center}
.tgt .nm input{border:0;background:transparent;font-weight:700;color:var(--navy);width:100%;min-height:38px;border-bottom:1px dashed var(--line)}
.sw{width:64px;height:38px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(-26px)}
.sw.off{opacity:.35}
.scroll{overflow-x:auto}
.grp{font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:18px;margin:12px 0 2px}
/* progress step */
.top-sum{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:14px;padding:12px 16px;margin-bottom:12px;flex-wrap:wrap}
.top-sum b{font-family:var(--f-display);font-size:24px;color:var(--navy)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.acc{border:1.5px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}
.acc>button.hd{width:100%;border:0;background:transparent;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;text-align:start}
.acc .hd .nm{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--navy);line-height:1.3}
.acc .hd .nm small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12.5px}
.acc .bd{padding:4px 14px 14px;display:grid;gap:10px}
.irow{display:grid;gap:6px;padding-block:8px;border-top:1px dashed var(--line)}
.irow:first-child{border-top:0}
.irow .t{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mini{width:56px;height:56px;flex:none}
.ring-bg{stroke:var(--line)}
/* dashboard */
.dash{display:grid;gap:14px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:16px}
.lh-text{font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:clamp(14px,2.6vw,17px);line-height:1.5}
.lh img{height:64px;width:auto;flex:none}
.title{background:var(--band);color:var(--band-ink);border-radius:14px;text-align:center;padding:10px 16px}
.title h2{font-family:var(--f-display);font-size:clamp(20px,4vw,30px);margin:0;border:0;padding:0;color:inherit}
.title .t2{display:block;font-size:.62em;font-weight:400;color:var(--gold-ink)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.strip div{background:var(--soft);color:var(--navy);font-weight:700;font-size:13.5px;text-align:center;padding:7px 8px;border-radius:6px}
.strip div .lb{display:block;font-weight:500;font-size:12px;opacity:.85}
.strip .term{background:var(--band);color:var(--gold-ink)}
.kp{display:grid;grid-template-columns:1.15fr repeat(3,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;align-content:start;box-shadow:var(--shadow)}
.kpi .lab{font-weight:700;color:var(--muted);font-size:13.5px}
.kpi .big{display:block;font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.1}
.kpi .sub{display:block;font-size:13px;color:var(--muted)}
.kpi.main{grid-row:span 1;grid-template-columns:auto 1fr;align-items:center;gap:14px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.k2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sec{font-family:var(--f-display);font-size:22px;color:var(--navy);margin:8px 0 0;padding-bottom:4px;border-bottom:3px solid var(--gold)}
.lag{display:grid;gap:10px}
.lg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.lg-h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lg-h b{font-family:var(--f-display);font-size:17px;color:var(--navy)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:1px 10px;border-radius:99px;font-weight:700}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
table.t{border-collapse:collapse;width:100%;min-width:760px}
table.t th{background:var(--teal);color:var(--teal-ink);font-weight:700;font-size:13px;padding:8px 6px;border:1px solid color-mix(in srgb,#fff 25%,transparent);text-align:center}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;vertical-align:middle}
table.t td .num{display:inline}td.num,th.num{display:table-cell}
tr.grp td{background:var(--strip,#EAF1F6)!important;color:var(--navy);font-weight:700;text-align:right;border-bottom:1px solid var(--line)}
tr.tot td{background:var(--navy)!important;color:#fff;font-weight:700;border:0}
table.t td.l{text-align:right;font-weight:700;color:var(--navy)}
table.t tbody tr:nth-child(even) td{background:var(--zebra)}
td.c0{background:var(--bad-bg)!important;color:var(--bad);font-weight:700}
td.c1{background:var(--warn-bg)!important;color:var(--warn);font-weight:700}
td.c2{background:var(--ok-bg)!important;color:var(--ok);font-weight:700}
td.cx{color:var(--muted)}
.exp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.xcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start}
.xcard b{font-family:var(--f-display);font-size:19px;color:var(--navy)}
.xcard span{font-size:14px;color:var(--muted)}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:520px;margin-inline:auto;background:var(--band);color:var(--band-ink);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:700;text-align:center}
.drop{border:2.5px dashed var(--line);border-radius:18px;padding:30px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--bg)}
.drop.on{border-color:var(--teal);background:var(--soft)}
.sector-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rk{display:grid;grid-template-columns:34px 1.6fr 2fr repeat(3,70px) 96px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rk:nth-child(even){background:var(--zebra)}
.rk .nm{font-weight:700;color:var(--navy)}
.rk.hdr{background:var(--teal);color:var(--teal-ink);font-weight:700;font-size:13px;border-radius:10px 10px 0 0}
.rk .pc{text-align:center}
.savebar{border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:700;margin-block:4px}
.savebar.ok{background:var(--ok-bg);color:var(--ok)}.savebar.warn{background:var(--warn-bg);color:var(--warn)}.savebar.bad{background:var(--bad-bg);color:var(--bad)}
/* footer */
.credit{max-width:1040px;margin:30px auto 0;padding:16px 16px 0;border-top:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
.credit img{width:84px;height:112px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.credit .wa{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#25D366;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-bottom:6px}.credit .wa:hover{filter:brightness(1.08)}
.credit span{line-height:1.8}.credit b{color:var(--navy);font-weight:800;font-size:15px}
.foot{position:relative;isolation:isolate;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));overflow:hidden;background:var(--bg)}
.foot::before{content:"";position:absolute;inset:0;background:var(--wave) center bottom/100% 100% no-repeat;opacity:var(--wave-o);z-index:-1}
.foot-in{direction:ltr;max-width:1040px;margin:0 auto;padding:34px 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;font-weight:600}
.foot-in span{direction:rtl}.foot-in img{height:46px;width:auto;max-width:100%}
@media (max-width:760px){
  .how,.three,.exp,.sector-sum{grid-template-columns:1fr 1fr}
  .three{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .kp{grid-template-columns:1fr}.k2{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .exp{grid-template-columns:1fr}
  .step{font-size:11.5px;padding:6px 2px}.step i{width:22px;height:22px}
  .rk{grid-template-columns:28px 1fr 64px;grid-auto-rows:auto}.rk>.hide-m{display:none}
  .step3{grid-template-columns:1fr}
  .saved{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function readCenterXlsx(buf){
  const z=await unzip(buf);
  const txt=async n=>{const u=await z.get(n);return u?dec.decode(u):null;};
  const P=new DOMParser(),doc=s=>P.parseFromString(s,'application/xml');
  const wb=await txt('xl/workbook.xml');if(!wb)throw new Error('bad');
  const wd=doc(wb);let rid=null;
  for(const s of wd.getElementsByTagName('sheet'))if(s.getAttribute('name')==='_data'){rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');}
  if(!rid)return await readTplXlsx(z,txt,doc,wd);
  const rels=doc(await txt('xl/_rels/workbook.xml.rels'));let target=null;
  for(const r of rels.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid)target=r.getAttribute('Target');
  target=target.replace(/^\//,'');if(!target.startsWith('xl/'))target='xl/'+target;
  const ss=await txt('xl/sharedStrings.xml');const shared=[];
  if(ss)for(const si of doc(ss).getElementsByTagName('si'))shared.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  const sd=doc(await txt(target)),vals=[];
  for(const c of sd.getElementsByTagName('c')){
    const ref=c.getAttribute('r');if(!/^A\d+$/.test(ref))continue;const t=c.getAttribute('t');let v='';
    if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
    else{const ve=c.getElementsByTagName('v')[0];v=ve?ve.textContent:'';if(t==='s')v=shared[+v]||'';}
    vals.push([+ref.slice(1),v]);
  }
  vals.sort((a,b)=>a[0]-b[0]);
  if(!vals.length||vals[0][1]!=='SHHUB1')throw new Error('nodata');
  const S=JSON.parse(vals.slice(1).map(x=>x[1]).join(''));
  if(!S||!S.center||!Array.isArray(S.schools))throw new Error('nodata');
  S.items=Array.isArray(S.items)&&S.items.length?S.items:DEF_ITEMS();
  return S;
}

  const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n`);add(body);add('\nendobj\n');};
  add('%PDF-1.4\n');
