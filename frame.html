<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="icon" type="image/png" href="/favicon.png?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرض الجوال</title>
<style>:root{--bg:#dfe6ec}:root[data-theme=dark]{--bg:#0a0f14}body{margin:0;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;font-family:system-ui,sans-serif;padding:0 16px}
#bw{width:100%}iframe{width:430px;max-width:100%;height:calc(100vh - 82px);min-height:560px;border:10px solid #1b2733;border-radius:34px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.35);margin:6px 0 14px}</style>
<script src="/shbar.js"></script></head>
<body><div id="bw"></div><iframe id="f" title="عرض الجوال"></iframe>
<script>
(function(){
var H=window.SHBar;if(H.PHONE){location.replace('/')}
var u=new URLSearchParams(location.search).get('u')||'/';if(u.charAt(0)!=='/'||u.indexOf('//')===0)u='/';
var fr=document.getElementById('f');H.ls('sh_view','m');fr.src=u;
function sbw(){try{return fr.contentWindow.SB}catch(e){return null}}
var bar=H.mount({framed:true,
 state:function(){var w=sbw();var o=w&&w.isOwner(),c=w&&w.isCoord();return{logged:!!(o||c),label:o?'المشرف':c?'منسق':'تسجيل الدخول'}},
 login:function(){try{fr.contentWindow.SBopenLogin()}catch(e){}},logout:function(){var w=sbw();if(w)w.logout()},
 toDesktop:function(){H.ls('sh_view',null);location.replace(u)},toMobile:function(){}});
document.getElementById('bw').appendChild(bar.el);
fr.addEventListener('load',function(){try{if(H.ls('sh_theme'))fr.contentDocument.documentElement.setAttribute('data-theme',H.ls('sh_theme'))}catch(e){}bar.paint()});
})();
</script></body></html>
